<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дневник давления</title>
</head>
<body>

<h1>Дневник давления</h1>

<a href="/add">Добавить запись</a>

<hr>

{% for record in records %}

<div>
    <p>
        Давление:
        {{ record.systolic }}/{{ record.diastolic }}

        | Пульс:
        {{ record.pulse }}

        | Дата:
        {{ record.created_at }}
    </p>
</div>

{% endfor %}

</body>
</html>
